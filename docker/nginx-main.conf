# Main nginx config for the unprivileged runtime image.
#
# The upstream image runs as the `nginx` user (uid 101), so the master process
# cannot write to /run or /var/log. The pid file and logs go to writable paths
# and stdout/stderr, which the container runtime collects.

worker_processes  auto;
pid /tmp/nginx.pid;
error_log /dev/stderr notice;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /dev/stdout main;

    sendfile        on;
    keepalive_timeout  65;

    include /etc/nginx/conf.d/*.conf;
}