server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "clipboard-read=(), clipboard-write=()" always;

    # CSP with nonce support (inline scripts/styles still needed for Vite dev,
    # but production build uses hashed inline scripts; 'unsafe-inline' kept for
    # hashed inline scripts compatibility — see Vite's build.cspNonce option)
    add_header Content-Security-Policy
        "default-src 'self';
         connect-src 'self' https://testnet.toncenter.com;
         script-src 'self' 'unsafe-inline' 'unsafe-eval';
         style-src 'self' 'unsafe-inline';
         img-src 'self' data:;
         font-src 'self' data:;
         base-uri 'self';
         form-action 'self';
         frame-ancestors 'none';" always;

    # Rate limiting for TON API calls (prevent abuse)
    limit_req_zone $binary_remote_addr zone=ton_api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=general:10m rate=100r/s;

    # SPA fallback — all routes go to index.html
    location / {
        limit_req zone=general burst=20 nodelay;
        try_files $uri $uri/ /index.html;
    }

    # Health endpoints (liveness + readiness)
    location /health/live {
        limit_req zone=general burst=5 nodelay;
        add_header Content-Type text/plain;
        return 200 "alive";
    }

    location /health/ready {
        limit_req zone=general burst=5 nodelay;
        add_header Content-Type text/plain;
        return 200 "ready";
    }

    # TON API proxy with rate limiting (if needed for CORS bypass)
    # location /api/ton/ {
    #     limit_req zone=ton_api burst=10 nodelay;
    #     proxy_pass https://testnet.toncenter.com/;
    #     proxy_set_header Host testnet.toncenter.com;
    #     proxy_ssl_server_name on;
    # }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Security: deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}